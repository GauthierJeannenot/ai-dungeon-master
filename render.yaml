services:
  - type: web
    name: ai-dungeon-master
    runtime: node
    plan: free
    branch: master
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -- -p $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODE
        value: live
      - key: ALLOW_PAID_LLM
        value: "true"
      - key: NARRATION_MODE
        value: quality
      - key: LLM_PROMPT_CACHE_ENABLED
        value: "true"
      - key: GAME_SESSION_STORE_DIR
        value: /tmp/ai-dm/sessions
      - key: APP_LOG_LEVEL
        value: debug
      - key: APP_LOG_INCLUDE_TEXT
        value: "true"
      - key: APP_LOG_BUFFER_ENABLED
        value: "true"
      - key: APP_LOG_BUFFER_LIMIT
        value: "1000"
      - key: APP_LOG_PERSIST_ENABLED
        value: "true"
      - key: APP_LOG_PERSIST_DIR
        value: /tmp/ai-dm/logs
      - key: APP_LOG_PERSIST_MAX_BYTES
        value: "20000000"
      - key: APP_DEBUG_LOG_PUBLIC_READ
        value: "true"
      - key: APP_DEBUG_LOG_TOKEN
        generateValue: true
