services:
  - type: web
    name: ai-dungeon-master
    runtime: node
    plan: free                          # Free tier — mise en veille après 15min sans trafic
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true                    # Re-déploie à chaque push sur la branche configurée
    envVars:
      - key: NODE_ENV
        value: production
      - key: OLLAMA_BASE_URL
        sync: false          # ex: http://TON-SERVEUR:11434 — à renseigner dans le dashboard
      - key: OLLAMA_MODEL
        value: qwen2.5:3b
      # Optionnel — si reverse proxy avec auth
      # - key: OLLAMA_API_KEY
      #   sync: false
