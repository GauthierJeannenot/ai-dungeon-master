name: Deploy to Fly.io

on:
  # Deploy after CI succeeds on the deployable branches.
  workflow_run:
    workflows: [CI]
    branches: [main, master]
    types: [completed]
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# Allow only one deployment at a time.
concurrency:
  group: deploy-fly
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Skip deploy when FLY_API_TOKEN is missing
        if: env.FLY_API_TOKEN == ''
        run: |
          echo "::notice::FLY_API_TOKEN is not configured; skipping Fly.io deploy."
          echo "::notice::Add a repository secret FLY_API_TOKEN (fly tokens create deploy) to enable CD."

      - name: Set up flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
