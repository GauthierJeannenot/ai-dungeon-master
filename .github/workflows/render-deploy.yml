name: Deploy to Render

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-render
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Skip deploy when RENDER_DEPLOY_HOOK_URL is missing
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "::notice::RENDER_DEPLOY_HOOK_URL is not configured; skipping Render deploy hook."
          echo "::notice::Render Blueprint auto-deploy can still deploy from render.yaml after checks pass."

      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" >/dev/null
          echo "Render deploy hook accepted."
