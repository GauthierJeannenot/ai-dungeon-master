name: Deploy to Render

on:
  workflow_dispatch:

concurrency:
  group: deploy-render
  cancel-in-progress: true

jobs:
  deploy:
    name: Trigger Render deploy hook
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Skip deploy when RENDER_DEPLOY_HOOK_URL is missing
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "::notice::RENDER_DEPLOY_HOOK_URL is not configured; skipping Render deploy hook."
          echo "::notice::Render Blueprint auto-deploy remains the automatic deployment path from render.yaml."

      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" >/dev/null
          echo "Render deploy hook accepted."
